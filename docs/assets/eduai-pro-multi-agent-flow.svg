    <rect x="680" y="165" width="240" height="180" rx="14" fill="#e6f7f2" stroke="#48a68d" stroke-width="2"/><text x="800" y="215" text-anchor="middle" font-size="24" font-weight="700" fill="#1d755f">资源推荐智能体</text><text x="800" y="255" text-anchor="middle" font-size="17" fill="#356f63">检索知识库</text><text x="800" y="285" text-anchor="middle" font-size="17" fill="#356f63">匹配难度与路径</text>
