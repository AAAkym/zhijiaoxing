# Logstash 配置文件
# 用于收集、处理和转发日志到 Elasticsearch

input {
  # 从文件收集应用日志
  file {
    path => "/var/log/zhijiaoxing/*.log"
    type => "application"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json {
      target => "parsed_json"
    }
  }

  # 从文件收集错误日志
  file {
    path => "/var/log/zhijiaoxing/error*.log"
    type => "error"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json {
      target => "parsed_json"
    }
  }

  # 从文件收集访问日志
  file {
    path => "/var/log/zhijiaoxing/access*.log"
    type => "access"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }

  # 从 Redis 收集日志
  redis {
    host => "redis"
    port => 6379
    data_type => "list"
    key => "logstash"
    type => "redis"
  }

  # Beats 输入
  beats {
    port => 5044
    type => "beats"
  }
}

filter {
  # 根据日志类型进行处理
  if [type] == "application" {
    # 解析应用日志
    if [parsed_json] {
      mutate {
        add_field => {
          "timestamp" => "%{[parsed_json][timestamp]}"
          "level" => "%{[parsed_json][level]}"
          "logger" => "%{[parsed_json][logger]}"
          "message" => "%{[parsed_json][message]}"
          "module" => "%{[parsed_json][module]}"
          "function" => "%{[parsed_json][function]}"
          "line" => "%{[parsed_json][line]}"
          "user_id" => "%{[parsed_json][user_id]}"
          "request_id" => "%{[parsed_json][request_id]}"
          "endpoint" => "%{[parsed_json][endpoint]}"
          "duration" => "%{[parsed_json][duration]}"
          "status_code" => "%{[parsed_json][status_code]}"
        }
        remove_field => ["parsed_json"]
      }
    }

    # 解析时间戳
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
    }

    # 根据日志级别设置标签
    if [level] == "ERROR" or [level] == "CRITICAL" {
      mutate {
        add_tag => ["error", "alert"]
      }
    } else if [level] == "WARNING" {
      mutate {
        add_tag => ["warning"]
      }
    }
  }

  if [type] == "error" {
    # 解析错误日志
    if [parsed_json] {
      mutate {
        add_field => {
          "timestamp" => "%{[parsed_json][timestamp]}"
          "level" => "%{[parsed_json][level]}"
          "error_type" => "%{[parsed_json][error_type]}"
          "error_message" => "%{[parsed_json][error_message]}"
          "stack_trace" => "%{[parsed_json][stack_trace]}"
          "user_id" => "%{[parsed_json][user_id]}"
          "request_id" => "%{[parsed_json][request_id]}"
          "endpoint" => "%{[parsed_json][endpoint]}"
        }
        remove_field => ["parsed_json"]
      }
    }

    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss,SSS"]
      target => "@timestamp"
    }

    mutate {
      add_tag => ["error", "alert"]
    }
  }

  if [type] == "access" {
    # 解析 Nginx/Apache 访问日志
    grok {
      match => {
        "message" => '%{COMBINEDAPACHELOG}'
      }
    }

    # 解析时间
    date {
      match => ["timestamp", "dd/MMM/yyyy:HH:mm:ss Z"]
      target => "@timestamp"
    }

    # 转换响应时间为数值
    mutate {
      convert => {
        "response" => "integer"
        "bytes" => "integer"
      }
    }

    # 根据状态码添加标签
    if [response] >= 500 {
      mutate {
        add_tag => ["server_error", "alert"]
      }
    } else if [response] >= 400 {
      mutate {
        add_tag => ["client_error"]
      }
    }
  }

  # 添加环境信息
  mutate {
    add_field => {
      "environment" => "${ENVIRONMENT:production}"
      "service" => "zhijiaoxing-backend"
      "host" => "%{[host][name]}"
    }
  }

  # 移除不必要的字段
  mutate {
    remove_field => ["@version", "path", "host", "message"]
  }
}

output {
  # 输出到 Elasticsearch
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
    index => "logstash-%{+YYYY.MM.dd}"
    template_name => "logstash"
    template_overwrite => true
    
    # 用户认证
    user => "${ELASTICSEARCH_USER:elastic}"
    password => "${ELASTICSEARCH_PASSWORD:changeme}"
    
    # SSL 配置
    ssl => ${ELASTICSEARCH_SSL:false}
    ssl_certificate_verification => ${ELASTICSEARCH_SSL_VERIFY:false}
    
    # 批量设置
    flush_size => 1000
    idle_flush_time => 10
  }

  # 错误日志同时输出到单独的索引
  if "error" in [tags] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
      index => "error-logs-%{+YYYY.MM.dd}"
      user => "${ELASTICSEARCH_USER:elastic}"
      password => "${ELASTICSEARCH_PASSWORD:changeme}"
    }
  }

  # 调试输出（开发环境）
  if "${LOGSTASH_DEBUG:false}" == "true" {
    stdout {
      codec => rubydebug
    }
  }
}
