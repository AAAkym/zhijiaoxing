[pytest]
# 收敛测试期第三方告警噪声（上轮 R-7 的前置小步：先降噪，再谈可观测性）。
#
# 背景：全量套件输出 2000+ 条 warning，绝大部分是 SQLAlchemy LegacyAPIWarning
# 与 datetime.utcnow() 的 DeprecationWarning，真正有用的告警被淹没。
#
# 原则（仿 Apache Airflow 的 pyproject 写法）：只按「消息正则 + 类别（+模块）」
# 精准忽略已知的第三方/已登记废弃噪声，**不做全类一刀切**——
# ignore::DeprecationWarning 这种宽过滤会掩盖项目自身的新回归。
# 收敛后若要更严格，可把某条升级为 error 防复发（仿 pandas 严格模式）。
filterwarnings =
    # SQLAlchemy 模型默认值 datetime.utcnow()（19 个模型文件均在用，修复需排期）
    ignore:datetime\.datetime\.utcnow\(\) is deprecated.*:DeprecationWarning
    # SQLAlchemy 2.0 标记的 legacy 用法（Query.get 等），逐条消化前先降噪
    ignore:.*is considered legacy.*:sqlalchemy.exc.LegacyAPIWarning
    ignore:.*legacy.*pre-2\.0.*:sqlalchemy.exc.LegacyAPIWarning
    # Werkzeug 3.0 对 bytes cookie 参数的废弃警告（来自 flask-session）
    ignore:The 'value' parameter must be a string.*:DeprecationWarning
