# Prometheus 告警规则
groups:
  - name: zhijiaoxing_alerts
    interval: 30s
    rules:
      # API 高错误率告警
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(api_requests_total{status_code=~"5.."}[5m]))
            /
            sum(rate(api_requests_total[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "API 错误率过高"
          description: "API 错误率超过 5%，当前值: {{ $value | humanizePercentage }}"

      # API 响应时间过长告警
      - alert: HighResponseTime
        expr: |
          histogram_quantile(0.95,
            sum(rate(api_response_time_seconds_bucket[5m])) by (le, endpoint)
          ) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API 响应时间过长"
          description: "端点 {{ $labels.endpoint }} 的 P95 响应时间超过 2 秒，当前值: {{ $value }}s"

      # 服务不可用告警
      - alert: ServiceDown
        expr: up{job="zhijiaoxing-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "服务不可用"
          description: "智教星 后端服务已停止运行"

      # 数据库查询缓慢告警
      - alert: SlowDatabaseQuery
        expr: |
          histogram_quantile(0.95,
            sum(rate(db_query_time_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "数据库查询缓慢"
          description: "数据库 P95 查询时间超过 0.5 秒，当前值: {{ $value }}s"

      # 活跃用户数异常告警
      - alert: AbnormalActiveUsers
        expr: |
          (
            active_users < 1
            and
            hour() >= 8 and hour() <= 22
          )
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "活跃用户数异常"
          description: "工作时间内活跃用户数为 0，可能存在访问问题"

      # 内存使用过高告警
      - alert: HighMemoryUsage
        expr: |
          (
            node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes
          ) / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "内存使用过高"
          description: "内存使用率超过 85%，当前值: {{ $value | humanizePercentage }}"

      # CPU 使用过高告警
      - alert: HighCPUUsage
        expr: |
          100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 使用过高"
          description: "CPU 使用率超过 80%，当前值: {{ $value }}%"

      # 磁盘空间不足告警
      - alert: LowDiskSpace
        expr: |
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "磁盘空间不足"
          description: "磁盘剩余空间不足 10%，当前值: {{ $value | humanizePercentage }}"

      # AI 生成时间过长告警
      - alert: LongAIGeneration
        expr: |
          histogram_quantile(0.95,
            sum(rate(ai_generation_time_seconds_bucket[10m])) by (le)
          ) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "AI 生成时间过长"
          description: "AI 生成 P95 时间超过 30 秒，当前值: {{ $value }}s"

      # 缓存命中率低告警
      - alert: LowCacheHitRate
        expr: |
          (
            sum(rate(cache_hits_total[5m]))
            /
            (
              sum(rate(cache_hits_total[5m]))
              +
              sum(rate(cache_misses_total[5m]))
            )
          ) < 0.7
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "缓存命中率低"
          description: "缓存命中率低于 70%，当前值: {{ $value | humanizePercentage }}"
