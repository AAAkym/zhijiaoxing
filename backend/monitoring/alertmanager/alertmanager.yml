# Alertmanager 配置文件
# 用于处理告警通知

global:
  # 全局 SMTP 配置
  smtp_smarthost: '${SMTP_HOST:localhost:587}'
  smtp_from: '${SMTP_FROM:alert@zhijiaoxing.com}'
  smtp_auth_username: '${SMTP_USER:}'
  smtp_auth_password: '${SMTP_PASSWORD:}'
  smtp_require_tls: true
  
  # 企业微信配置
  wechat_api_url: 'https://qyapi.weixin.qq.com/cgi-bin/'
  wechat_api_corp_id: '${WECHAT_CORP_ID:}'
  
  # 钉钉配置
  dingtalk_api_url: 'https://oapi.dingtalk.com/robot/send'
  
  # 飞书配置
  feishu_api_url: 'https://open.feishu.cn/open-apis/bot/v2/hook/'
  
  # 解决时间
  resolve_timeout: 5m

# 路由配置
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  
  # 子路由
  routes:
    # 严重告警 - 立即通知
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      repeat_interval: 5m
      continue: true
    
    # 警告级别 - 合并通知
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 30s
      repeat_interval: 2h
      continue: true
    
    # 信息级别 - 每日汇总
    - match:
        severity: info
      receiver: 'info-alerts'
      group_wait: 5m
      repeat_interval: 24h

# 抑制规则
inhibit_rules:
  # 严重告警抑制警告
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
  
  # 相同告警抑制
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'critical'
    equal: ['alertname', 'service', 'instance']

# 接收器配置
receivers:
  # 默认接收器
  - name: 'default'
    email_configs:
      - to: '${DEFAULT_EMAIL:admin@zhijiaoxing.com}'
        subject: '[智教星告警] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          告警名称: {{ .Annotations.summary }}
          告警详情: {{ .Annotations.description }}
          告警级别: {{ .Labels.severity }}
          服务: {{ .Labels.service }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

  # 严重告警接收器
  - name: 'critical-alerts'
    email_configs:
      - to: '${CRITICAL_EMAIL:oncall@zhijiaoxing.com}'
        subject: '[严重告警] {{ .GroupLabels.alertname }}'
        body: |
          🚨 严重告警 🚨
          
          {{ range .Alerts }}
          告警名称: {{ .Annotations.summary }}
          告警详情: {{ .Annotations.description }}
          告警级别: {{ .Labels.severity }}
          服务: {{ .Labels.service }}
          实例: {{ .Labels.instance }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          
          请立即处理！
          {{ end }}
    
    # 企业微信通知
    webhook_configs:
      - url: 'http://wechat-webhook:8080/webhook/wechat'
        send_resolved: true
        http_config:
          headers:
            Content-Type: application/json
        title: '{{ .GroupLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          🚨 {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
    
    # 钉钉通知
    dingtalk_configs:
      - webhook_url: '${DINGTALK_WEBHOOK:}'
        title: '{{ .GroupLabels.alertname }}'
        message: |
          {{ range .Alerts }}
          🚨 {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  # 警告级别接收器
  - name: 'warning-alerts'
    email_configs:
      - to: '${WARNING_EMAIL:devops@zhijiaoxing.com}'
        subject: '[警告] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          告警名称: {{ .Annotations.summary }}
          告警详情: {{ .Annotations.description }}
          告警级别: {{ .Labels.severity }}
          服务: {{ .Labels.service }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}
    
    # Slack 通知
    slack_configs:
      - api_url: '${SLACK_WEBHOOK:}'
        channel: '#alerts'
        title: '{{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          ⚠️ {{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}

  # 信息级别接收器
  - name: 'info-alerts'
    email_configs:
      - to: '${INFO_EMAIL:team@zhijiaoxing.com}'
        subject: '[信息] {{ .GroupLabels.alertname }}'
        body: |
          {{ range .Alerts }}
          告警名称: {{ .Annotations.summary }}
          告警详情: {{ .Annotations.description }}
          时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ end }}

# 模板配置
templates:
  - '/etc/alertmanager/templates/*.tmpl'
